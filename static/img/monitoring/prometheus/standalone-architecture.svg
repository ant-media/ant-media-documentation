<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title description">
  <title id="title">Monitoring a single Ant Media Server with Prometheus and Grafana</title>
  <desc id="description">On one server, Ant Media Server publishes metrics on port 9090. Prometheus reads them every 15 seconds and stores them, listening privately on port 9091. Grafana reads from Prometheus and shows dashboards on port 3000, which you open in your web browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2167a6"/>
    </marker>
  </defs>
  <rect width="1000" height="420" rx="16" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#172b4d">
    <text x="500" y="40" font-size="23" font-weight="700">What you will build</text>

    <!-- server boundary -->
    <rect x="30" y="70" width="740" height="300" rx="16" fill="#f7f9fc" stroke="#62748a" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="400" y="100" font-size="17" font-weight="700" fill="#62748a">Your Ant Media Server machine</text>

    <!-- AMS -->
    <rect x="60" y="150" width="200" height="140" rx="12" fill="#eaf4ff" stroke="#2167a6" stroke-width="2"/>
    <text x="160" y="190" font-size="21" font-weight="700">Ant Media</text>
    <text x="160" y="215" font-size="21" font-weight="700">Server</text>
    <text x="160" y="250" font-size="16">Publishes numbers</text>
    <text x="160" y="272" font-size="16">port 9090</text>

    <!-- Prometheus -->
    <rect x="300" y="150" width="200" height="140" rx="12" fill="#fff3e8" stroke="#c75b12" stroke-width="2"/>
    <text x="400" y="200" font-size="21" font-weight="700">Prometheus</text>
    <text x="400" y="235" font-size="16">Collects &amp; stores</text>
    <text x="400" y="257" font-size="16">every 15 seconds</text>
    <text x="400" y="279" font-size="16">port 9091 (private)</text>

    <!-- Grafana -->
    <rect x="540" y="150" width="200" height="140" rx="12" fill="#fff8db" stroke="#b28704" stroke-width="2"/>
    <text x="640" y="200" font-size="21" font-weight="700">Grafana</text>
    <text x="640" y="235" font-size="16">Draws dashboards</text>
    <text x="640" y="265" font-size="16">port 3000</text>

    <!-- Browser -->
    <rect x="810" y="150" width="160" height="140" rx="12" fill="#eaf7ee" stroke="#2e7d32" stroke-width="2"/>
    <text x="890" y="205" font-size="21" font-weight="700">You</text>
    <text x="890" y="240" font-size="16">in a web</text>
    <text x="890" y="262" font-size="16">browser</text>

    <line x1="262" y1="220" x2="298" y2="220" stroke="#2167a6" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="502" y1="220" x2="538" y2="220" stroke="#2167a6" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="742" y1="220" x2="808" y2="220" stroke="#2167a6" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="400" y="340" font-size="15" fill="#2167a6">Numbers flow from left to right, refreshed every 15 seconds</text>

    <text x="500" y="400" font-size="15" fill="#62748a">Only Grafana (port 3000) needs to be reachable, and only from your own IP address.</text>
  </g>
</svg>
